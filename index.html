<title>IS Career Launchpad</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #172033;
    line-height: 1.6;
}

header {
    background: #101828;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: 800;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 24px;
    font-weight: 600;
    cursor: pointer;
}

nav a:hover {
    opacity: .75;
}

.hero {
    background: linear-gradient(135deg, #172554, #2563eb);
    color: white;
    padding: 90px 7%;
}

.hero h1 {
    font-size: clamp(40px, 7vw, 72px);
    line-height: 1.05;
    max-width: 800px;
    margin-bottom: 22px;
}

.hero p {
    max-width: 680px;
    font-size: 20px;
    opacity: .92;
}

.container {
    width: 86%;
    max-width: 1200px;
    margin: auto;
}

.section {
    padding: 65px 0;
}

.section h2 {
    font-size: 34px;
    margin-bottom: 12px;
}

.section-intro {
    color: #667085;
    max-width: 750px;
    margin-bottom: 30px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.card {
    background: white;
    border: 1px solid #e4e7ec;
    border-radius: 18px;
    padding: 27px;
    box-shadow: 0 8px 25px rgba(16,24,40,.06);
    transition: transform .2s, box-shadow .2s;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 35px rgba(16,24,40,.10);
}

.card-number {
    display: inline-block;
    background: #eaf2ff;
    color: #175cd3;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 15px;
}

.card h3 {
    font-size: 24px;
    margin-bottom: 8px;
}

.card p {
    color: #667085;
    margin-bottom: 18px;
}

.button {
    border: none;
    background: #175cd3;
    color: white;
    padding: 11px 17px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 700;
}

.button:hover {
    background: #1247a7;
}

.button.secondary {
    background: #eef2f6;
    color: #172033;
}

.button.secondary:hover {
    background: #dfe5ec;
}

#app {
    min-height: 500px;
}

.detail-header {
    background: #101828;
    color: white;
    padding: 60px 7%;
}

.detail-header h1 {
    font-size: 46px;
    margin-bottom: 10px;
}

.detail-header p {
    color: #d0d5dd;
    max-width: 750px;
    font-size: 18px;
}

.back {
    margin-top: 25px;
}

.detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.info-box {
    background: white;
    border: 1px solid #e4e7ec;
    border-radius: 16px;
    padding: 25px;
}

.info-box h3 {
    margin-bottom: 12px;
    font-size: 21px;
}

.info-box ul {
    padding-left: 20px;
}

.info-box li {
    margin-bottom: 7px;
}

.salary-box {
    background: #eff8ff;
    border: 1px solid #b2ddff;
}

.salary-number {
    font-size: 31px;
    font-weight: 800;
    color: #175cd3;
}

.source {
    margin-top: 15px;
    font-size: 13px;
    color: #667085;
}

.source a {
    color: #175cd3;
}

.interview-card {
    background: white;
    border: 1px solid #e4e7ec;
    border-radius: 18px;
    padding: 30px;
    max-width: 900px;
    margin: auto;
}

.progress {
    height: 9px;
    background: #eaecf0;
    border-radius: 99px;
    overflow: hidden;
    margin: 15px 0 30px;
}

.progress-bar {
    height: 100%;
    background: #175cd3;
    transition: width .3s;
}

.question-number {
    color: #667085;
    font-weight: 700;
    margin-bottom: 8px;
}

.question {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.25;
    margin-bottom: 25px;
}

textarea {
    width: 100%;
    min-height: 170px;
    border: 1px solid #d0d5dd;
    border-radius: 12px;
    padding: 15px;
    font-family: inherit;
    font-size: 16px;
    resize: vertical;
    margin-bottom: 15px;
}

textarea:focus {
    outline: 3px solid #dbeafe;
    border-color: #175cd3;
}

.feedback {
    margin-top: 25px;
    padding: 22px;
    background: #f8f9fc;
    border-radius: 13px;
    border-left: 5px solid #175cd3;
}

.feedback h3 {
    margin-bottom: 8px;
}

.tip {
    background: #fffaeb;
    border: 1px solid #fedf89;
    padding: 18px;
    border-radius: 12px;
    margin-top: 18px;
}

.methodology {
    background: #101828;
    color: white;
    padding: 50px 0;
}

.methodology p,
.methodology li {
    color: #d0d5dd;
}

.methodology ul {
    padding-left: 20px;
    margin-top: 15px;
}

footer {
    background: #0b1220;
    color: #98a2b3;
    text-align: center;
    padding: 25px;
    font-size: 13px;
}

.empty {
    text-align: center;
    padding: 100px 20px;
}

.action-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.badge {
    display: inline-block;
    background: #f2f4f7;
    color: #344054;
    border-radius: 99px;
    padding: 5px 10px;
    margin: 3px;
    font-size: 12px;
    font-weight: 700;
}

.career-tag {
    color: #175cd3;
    font-weight: 700;
    margin-bottom: 12px;
}

@media (max-width: 800px) {
    .cards,
    .detail-grid {
        grid-template-columns: 1fr;
    }

    header {
        flex-direction: column;
        gap: 12px;
    }

    nav a {
        margin: 0 7px;
    }

    .hero {
        padding: 65px 7%;
    }

    .detail-header h1 {
        font-size: 36px;
    }
}
</style>
</head>

let currentCareer = null;
let currentQuestion = 0;
let interviewAnswers = [];


function showInterviews() {

    document.getElementById("app").innerHTML = `

        <section class="detail-header">

            <div class="container">

                <h1>Practice Interviews</h1>

                <p>
                    Choose a career and practice technical and behavioral
                    questions designed for entry-level interviews.
                </p>

            </div>

        </section>

        <section class="section">

            <div class="container">

                <div class="cards">

                    ${Object.keys(careers).map(key => {

                        const c = careers[key];

                        return `

                            <div class="card">

                                <h3>${c.title}</h3>

                                <p>
                                    ${questions[key].length}
                                    practice questions
                                </p>

                                <button
                                    class="button"
                                    onclick="startInterview('${key}')">
                                    Start Interview
                                </button>

                            </div>

                        `;

                    }).join("")}

                </div>

            </div>

        </section>
    `;
}


function startInterview(key) {

    currentCareer = key;
    currentQuestion = 0;
    interviewAnswers = [];

    renderQuestion();
}


function renderQuestion() {

    const c = careers[currentCareer];
    const q = questions[currentCareer][currentQuestion];

    const progress =
        ((currentQuestion) / questions[currentCareer].length) * 100;

    document.getElementById("app").innerHTML = `

        <section class="detail-header">

            <div class="container">

                <div class="career-tag">
                    MOCK INTERVIEW
                </div>

                <h1>${c.title}</h1>

                <p>
                    Answer as if you were speaking directly with an interviewer.
                </p>

            </div>

        </section>

        <section class="section">

            <div class="container">

                <div class="interview-card">

                    <div class="question-number">
                        Question ${currentQuestion + 1}
                        of ${questions[currentCareer].length}
                    </div>

                    <div class="progress">

                        <div
                            class="progress-bar"
                            style="width:${progress}%">
                        </div>

                    </div>

                    <span class="badge">${q.type}</span>

                    <div class="question">
                        ${q.q}
                    </div>

                    <textarea
                        id="answer"
                        placeholder="Type your answer here...">
                    </textarea>

                    <div class="action-row">

                        <button
                            class="button"
                            onclick="submitAnswer()">
                            Submit Answer
                        </button>

                        <button
                            class="button secondary"
                            onclick="skipQuestion()">
                            Skip
                        </button>

                    </div>

                    <div id="feedback"></div>

                </div>

            </div>

        </section>
    `;
}


function submitAnswer() {

    const answer =
        document.getElementById("answer").value.trim();

    if (!answer) {

        document.getElementById("feedback").innerHTML = `

            <div class="feedback">

                <h3>Give it a try first.</h3>

                <p>
                    Type a response before viewing the suggested strong answer.
                </p>

            </div>

        `;

        return;
    }

    interviewAnswers.push(answer);

    const q = questions[currentCareer][currentQuestion];

    let feedback = "";

    if (answer.length < 80) {

        feedback = `
            Your answer is a good start. Add more specific details,
            examples, and your personal contribution.
        `;

    } else if (
        answer.toLowerCase().includes("example") ||
        answer.toLowerCase().includes("because") ||
        answer.toLowerCase().includes("result") ||
        answer.toLowerCase().includes("project")
    ) {

        feedback = `
            Good job. Your answer includes details that can help an
            interviewer understand your reasoning. Keep connecting your
            answer to a specific result.
        `;

    } else {

        feedback = `
            Solid response. To make it stronger, add a concrete example,
            explain your reasoning, and describe the result.
        `;
    }

    document.getElementById("feedback").innerHTML = `

        <div class="feedback">

            <h3>Feedback</h3>

            <p>${feedback}</p>

            <div class="tip">

                <strong>Suggested strong answer:</strong>

                <p style="margin-top:8px;">
                    ${q.strong}
                </p>

            </div>

            <div class="action-row" style="margin-top:20px;">

                ${
                    currentQuestion <
                    questions[currentCareer].length - 1

                    ?

                    `
                    <button
                        class="button"
                        onclick="nextQuestion()">
                        Next Question →
                    </button>
                    `

                    :

                    `
                    <button
                        class="button"
                        onclick="finishInterview()">
                        Finish Interview
                    </button>
                    `
                }

            </div>

        </div>
    `;
}


function nextQuestion() {

    currentQuestion++;

    renderQuestion();
}


function skipQuestion() {

    currentQuestion++;

    if (
        currentQuestion >=
        questions[currentCareer].length
    ) {

        finishInterview();

    } else {

        renderQuestion();

    }
}


function finishInterview() {

    const c = careers[currentCareer];

    document.getElementById("app").innerHTML = `

        <section class="detail-header">

            <div class="container">

                <div class="career-tag">
                    INTERVIEW COMPLETE
                </div>

                <h1>Nice work.</h1>

                <p>
                    You completed the ${c.title} practice interview.
                </p>

            </div>

        </section>

        <section class="section">

            <div class="container">

                <div class="interview-card">

                    <h2>How to improve your answers</h2>

                    <p style="margin-top:15px;">
                        Strong interview answers should be specific,
                        structured, and connected to real experiences.
                    </p>

                    <div class="tip">

                        <strong>Use the STAR framework for behavioral questions.</strong>

                        <p style="margin-top:8px;">
                            Situation → Task → Action → Result
                        </p>

                    </div>

                    <div class="tip">

                        <strong>For technical questions:</strong>

                        <p style="margin-top:8px;">
                            Explain your reasoning, not just the final answer.
                            Interviewers often care about how you approach a
                            problem.
                        </p>

                    </div>

                    <div class="action-row" style="margin-top:25px;">

                        <button
                            class="button"
                            onclick="startInterview('${currentCareer}')">
                            Try Again
                        </button>

                        <button
                            class="button secondary"
                            onclick="showInterviews()">
                            Choose Another Career
                        </button>

                    </div>

                </div>

            </div>

        </section>
    `;
}
